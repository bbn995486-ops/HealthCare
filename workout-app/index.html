<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Workout AI</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Workout AI" />
  <link rel="apple-touch-icon" href="icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="shortcut icon" href="icon.png" type="image/png">
  <script>
    const manifest = {
      "short_name": "Workout AI",
      "name": "Workout AI",
      "icons": [{"src": "icon.png", "type": "image/png", "sizes": "512x512"}],
      "start_url": ".",
      "background_color": "#efefef",
      "theme_color": "#b83048",
      "display": "standalone",
      "orientation": "portrait"
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = manifestURL;
    document.head.appendChild(link);
  </script>

  <style>
    body {
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    input, textarea {
      -webkit-user-select: text;
      user-select: text;
    }
  </style>
</head>
<body class="bg-[#efefef]">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      const [page, setPage] = useState('home');
      const [selectedDay, setSelectedDay] = useState('월');
      const [routineData, setRoutineData] = useState({
        월: { title: '등 · 광배', exercises: [{ name: '랫풀다운', sets: ['40 x 10', '50 x 10'], completed: false }] },
        화: { title: '팔', exercises: [{ name: '브이바 푸쉬다운', sets: ['40 x 10'], completed: false }] },
        수: { title: '휴식', exercises: [] },
        목: { title: '어깨', exercises: [{ name: '케이블 사레레', sets: ['5 x 10'], completed: false }] },
        금: { title: '가슴', exercises: [{ name: '벤치프레스', sets: ['60 x 10'], completed: false }] },
        토: { title: '하체', exercises: [{ name: '레그프레스', sets: ['160 x 10'], completed: false }] },
        일: { title: '휴식', exercises: [] },
      });

      const [showAddModal, setShowAddModal] = useState(false);
      const [showEditModal, setShowEditModal] = useState(false);
      const [editingDay, setEditingDay] = useState('월');
      const [editingIndex, setEditingIndex] = useState(0);
      const [exerciseName, setExerciseName] = useState('');
      const [exerciseSets, setExerciseSets] = useState('10 x 10');
      const [aiQuestion, setAiQuestion] = useState('');
      const [aiAnswer, setAiAnswer] = useState('AI 코치가 현재 루틴을 분석 중입니다.');

      const currentData = routineData[selectedDay];

      const toggleExercise = (index) => {
        const updated = { ...routineData };
        updated[selectedDay].exercises[index].completed = !updated[selectedDay].exercises[index].completed;
        setRoutineData(updated);
      };

      const addExercise = () => {
        if (!exerciseName.trim()) return;
        const updated = { ...routineData };
        updated[editingDay].exercises.push({
          name: exerciseName,
          sets: exerciseSets.split(',').map((v) => v.trim()),
          completed: false,
        });
        setRoutineData(updated);
        setExerciseName('');
        setExerciseSets('10 x 10');
        setShowAddModal(false);
      };

      const editExercise = () => {
        if (!exerciseName.trim()) return;
        const updated = { ...routineData };
        updated[editingDay].exercises[editingIndex] = {
          ...updated[editingDay].exercises[editingIndex],
          name: exerciseName,
          sets: exerciseSets.split(',').map((v) => v.trim()),
        };
        setRoutineData(updated);
        setShowEditModal(false);
      };

      const deleteExercise = (day, index) => {
        const updated = { ...routineData };
        updated[day].exercises = updated[day].exercises.filter((_, idx) => idx !== index);
        setRoutineData(updated);
      };

      return (
        <div class="min-h-screen pb-24">
          <div class="max-w-md mx-auto p-4">
            <div class="flex items-center gap-3 mb-1">
              <img src="icon.png" class="w-10 h-10 object-contain rounded-xl" />
              <h1 class="text-3xl font-black">Workout AI</h1>
            </div>
            <p class="text-sm text-gray-500 mb-6">루틴 · AI 분석 · 퍼포먼스</p>

            {page === 'home' && (
              <div>
                <div class="grid grid-cols-7 gap-2 mb-5">
                  {Object.keys(routineData).map((day) => (
                    <button
                      key={day}
                      onClick={() => setSelectedDay(day)}
                      class={`rounded-2xl py-3 text-sm font-bold border ${selectedDay === day ? 'bg-[#b83048] text-white border-[#b83048]' : 'bg-white border-gray-200'}`}
                    >
                      {day}
                    </button>
                  ))}
                </div>

                <div class="bg-white rounded-3xl p-5 border border-gray-200">
                  <h2 class="text-xl font-bold mb-1">{currentData.title}</h2>
                  <div class="space-y-3 mt-5">
                    {currentData.exercises.map((exercise, index) => (
                      <div key={index} class="rounded-2xl border border-gray-200 p-4 bg-white">
                        <div class="flex items-start justify-between gap-3">
                          <div class="flex-1">
                            <div class="font-semibold text-sm">{exercise.name}</div>
                            <div class="flex flex-wrap gap-2 mt-2">
                              {exercise.sets.map((set, idx) => (
                                <div key={idx} class="rounded-xl bg-[#f8e9ed] px-3 py-1 text-xs font-bold text-[#b83048]">{set}</div>
                              ))}
                            </div>
                          </div>
                          <button
                            onClick={() => toggleExercise(index)}
                            class={`w-6 h-6 rounded-full flex items-center justify-center text-xs font-black ${exercise.completed ? 'bg-green-600 text-white' : 'border-2 border-dotted border-[#b83048]'}`}
                          >
                            ✔
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {page === 'calendar' && (
              <div class="bg-white rounded-3xl p-5 border border-gray-200">
                <h2 class="text-xl font-bold mb-5">캘린더</h2>
                <div class="grid grid-cols-7 gap-2">
                  {Array.from({ length: 31 }).map((_, idx) => (
                    <div key={idx} class="aspect-square rounded-2xl bg-gray-100 flex items-center justify-center text-sm font-bold">{idx + 1}</div>
                  ))}
                </div>
              </div>
            )}

            {page === 'analysis' && (
              <div class="bg-white rounded-3xl p-5 border border-gray-200">
                <h2 class="text-xl font-bold mb-4">AI 코치</h2>
                <div class="rounded-2xl bg-gray-100 p-4 text-sm leading-7 min-h-[120px]">{aiAnswer}</div>
                <textarea
                  value={aiQuestion}
                  onChange={(e) => setAiQuestion(e.target.value)}
                  placeholder="질문 입력"
                  class="w-full rounded-2xl border border-gray-200 p-4 mt-4 min-h-[100px] outline-none"
                />
                <button onClick={() => setAiAnswer(`분석 완료: ${aiQuestion}`)} class="w-full rounded-2xl bg-[#b83048] py-4 text-white font-bold mt-4">AI 분석 요청</button>
              </div>
            )}

            {page === 'settings' && (
              <div class="space-y-4">
                {Object.entries(routineData).map(([day, data]) => (
                  <div key={day} class="bg-white rounded-3xl p-5 border border-gray-200">
                    <div class="flex items-center justify-between mb-4">
                      <div>
                        <h2 class="font-bold text-lg text-[#b83048]">{day}</h2>
                        <p class="text-sm text-gray-500">{data.title}</p>
                      </div>
                    </div>
                    <button
                      onClick={() => { setEditingDay(day); setExerciseName(''); setExerciseSets('10 x 10'); setShowAddModal(true); }}
                      class="w-full rounded-2xl border-2 border-dotted border-[#b83048] py-3 text-sm font-bold text-[#b83048]"
                    >
                      + 운동 추가
                    </button>
                    <div class="space-y-2 mt-4">
                      {data.exercises.map((exercise, index) => (
                        <div key={index} class="rounded-2xl bg-gray-100 p-4 flex items-center justify-between">
                          <div>
                            <div class="font-semibold text-sm">{exercise.name}</div>
                            <div class="text-xs text-gray-500 mt-1">{exercise.sets.join(', ')}</div>
                          </div>
                          <div class="flex gap-3">
                            <button onClick={() => { setEditingDay(day); setEditingIndex(index); setExerciseName(exercise.name); setExerciseSets(exercise.sets.join(', ')); setShowEditModal(true); }} class="text-sm font-bold text-[#b83048]">수정</button>
                            <button onClick={() => deleteExercise(day, index)} class="text-sm font-bold text-red-500">삭제</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-3 px-4">
            <div class="max-w-md mx-auto grid grid-cols-4 gap-2 text-center">
              <button onClick={() => setPage('home')} class={`font-bold text-sm ${page === 'home' ? 'text-[#b83048]' : 'text-gray-400'}`}>홈</button>
              <button onClick={() => setPage('calendar')} class={`font-bold text-sm ${page === 'calendar' ? 'text-[#b83048]' : 'text-gray-400'}`}>캘린더</button>
              <button onClick={() => setPage('analysis')} class={`font-bold text-sm ${page === 'analysis' ? 'text-[#b83048]' : 'text-gray-400'}`}>분석</button>
              <button onClick={() => setPage('settings')} class={`font-bold text-sm ${page === 'settings' ? 'text-[#b83048]' : 'text-gray-400'}`}>설정</button>
            </div>
          </div>

          {/* 모달창들 생략 없이 정상 작동 */}
          {showAddModal && (
            <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
              <div class="bg-white rounded-3xl p-5 w-full max-w-sm">
                <h2 class="text-xl font-bold mb-4">운동 추가</h2>
                <input value={exerciseName} onChange={(e) => setExerciseName(e.target.value)} placeholder="운동 이름" class="w-full rounded-2xl border border-gray-200 p-4 outline-none mb-3" />
                <input value={exerciseSets} onChange={(e) => setExerciseSets(e.target.value)} placeholder="40 x 10, 50 x 8" class="w-full rounded-2xl border border-gray-200 p-4 outline-none" />
                <button onClick={addExercise} class="w-full rounded-2xl bg-[#b83048] py-4 text-white font-bold mt-4">완료</button>
              </div>
            </div>
          )}

          {showEditModal && (
            <div class="fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
              <div class="bg-white rounded-3xl p-5 w-full max-w-sm">
                <h2 class="text-xl font-bold mb-4">운동 수정</h2>
                <input value={exerciseName} onChange={(e) => setExerciseName(e.target.value)} placeholder="운동 이름" class="w-full rounded-2xl border border-gray-200 p-4 outline-none mb-3" />
                <input value={exerciseSets} onChange={(e) => setExerciseSets(e.target.value)} placeholder="40 x 10, 50 x 8" class="w-full rounded-2xl border border-gray-200 p-4 outline-none" />
                <button onClick={editExercise} class="w-full rounded-2xl bg-[#b83048] py-4 text-white font-bold mt-4">완료</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = RoyalReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    // 가상 서비스 워커 스크립트 활성화
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([`
        self.addEventListener('fetch', function(e) { e.respondWith(fetch(e.request)); });
      `], {type: 'application/javascript'})));
    }
  </script>
</body>
</html>
